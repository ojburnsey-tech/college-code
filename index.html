<style>
:root{color-scheme:light dark;--bg:#fff;--label:#000;--label2:rgba(60,60,67,.6);--fill:rgba(120,120,128,.14);--group:#f2f2f7;--cell:#fff;--sep:rgba(60,60,67,.29);--tint:#007aff;--scrim:rgba(0,0,0,.22);--pass:#233a5e;--pass-shadow:0 1px 2px rgba(0,0,0,.08),0 8px 22px rgba(0,0,0,.12)}
@media (prefers-color-scheme:dark){:root{--bg:#000;--label:#fff;--label2:rgba(235,235,245,.6);--fill:rgba(118,118,128,.26);--group:#1c1c1e;--cell:#2c2c2e;--sep:rgba(84,84,88,.6);--tint:#0a84ff;--scrim:rgba(0,0,0,.5);--pass-shadow:inset 0 0 0 .5px rgba(255,255,255,.1)}}
html,body{margin:0;height:100%;overflow:hidden;background:var(--bg);touch-action:none;overscroll-behavior:none;-webkit-text-size-adjust:100%;text-size-adjust:100%}
body{font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","Helvetica Neue",sans-serif;color:var(--label);-webkit-font-smoothing:antialiased;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;-webkit-tap-highlight-color:transparent}
h2,p{margin:0}
button{font:inherit;color:inherit;background:none;border:0;padding:0;margin:0;cursor:pointer;-webkit-appearance:none;appearance:none;touch-action:none}
:focus{outline:none}
:focus-visible{outline:2px solid var(--tint);outline-offset:3px}
#root{position:fixed;left:50%;top:50%;width:100vw;height:100vh;transform:translate(-50%,-50%);overflow:hidden;background:var(--bg);--top:env(safe-area-inset-top);--bottom:env(safe-area-inset-bottom);--side:0px}
#root.turned{--top:max(env(safe-area-inset-left),env(safe-area-inset-right));--bottom:var(--top);--side:env(safe-area-inset-bottom)}
.bar{height:52px;margin-top:var(--top);padding:0 calc(16px + var(--side));display:flex;align-items:center;justify-content:flex-end}
.more{width:34px;height:34px;border-radius:50%;display:grid;place-items:center;background:var(--fill);transition:transform .12s ease-out}
.more.pressed{transform:scale(.9);transition-duration:.06s}
.more svg{width:18px;height:18px;fill:var(--label)}
.wrap{padding:4px calc(16px + var(--side)) 0}
.pass{max-width:420px;margin:0 auto;aspect-ratio:343/440;display:flex;flex-direction:column;box-sizing:border-box;padding:13px 15px 16px;border-radius:14px;color:#fff;background:linear-gradient(180deg,rgba(255,255,255,.09),rgba(255,255,255,0) 30%),var(--pass);box-shadow:var(--pass-shadow)}
.head{display:flex;align-items:flex-start;justify-content:space-between;gap:12px}
.logo{font-size:18px;font-weight:600;letter-spacing:-.012em;line-height:1.2;padding-top:7px}
.l{display:block;font-size:11px;font-weight:600;letter-spacing:.03em;line-height:1.35;text-transform:uppercase;color:rgba(206,220,244,.8)}
.v{display:block;font-size:17px;line-height:1.25;letter-spacing:-.01em}
.r{text-align:right}
.primary{margin-top:26px}
.primary .v{font-size:30px;line-height:1.12;letter-spacing:-.018em}
.code{margin:auto auto 0;width:64%;display:flex;flex-direction:column;align-items:center;box-sizing:border-box;padding:10px 10px 7px;border-radius:9px;background:#fff;transition:transform .14s ease-out}
.code.pressed{transform:scale(.97);transition-duration:.07s}
.code svg,.big svg{display:block;width:100%;height:auto;aspect-ratio:1}
.code svg{transition:opacity .15s}
.scanning .code svg{opacity:0;transition:none}
.alt{margin-top:2px;font-size:12px;line-height:1.3;color:#1c1c1e;font-variant-numeric:tabular-nums;letter-spacing:.03em}
.scan{position:absolute;inset:0;z-index:10;display:flex;flex-direction:column;align-items:center;justify-content:center;visibility:hidden}
.scan.on{visibility:visible}
.wash{position:absolute;inset:0;background:#fff;opacity:0}
.big{position:relative;width:min(84%,calc(var(--h,100vh)*.6),500px);transform-origin:0 0;will-change:transform}
.meta{position:relative;margin-top:24px;color:#1c1c1e;font-size:17px;font-variant-numeric:tabular-nums;letter-spacing:.02em;opacity:0}
.sheet{position:absolute;inset:0;z-index:20;visibility:hidden}
.sheet.on{visibility:visible}
.scrim{position:absolute;inset:0;background:var(--scrim);opacity:0}
.panel{position:absolute;left:0;right:0;bottom:0;max-width:540px;margin:0 auto;box-sizing:border-box;padding:6px calc(16px + var(--side)) calc(var(--bottom) + 28px);border-radius:16px 16px 0 0;background:var(--group);transform:translate3d(0,100%,0);will-change:transform}
.grab{width:36px;height:5px;border-radius:3px;margin:0 auto;background:var(--label2);opacity:.45}
.sheet-bar{position:relative;display:flex;align-items:center;justify-content:center;height:46px}
.sheet-bar h2{font-size:17px;font-weight:600;letter-spacing:-.01em}
.done{position:absolute;right:0;top:50%;transform:translateY(-50%);padding:10px 0 10px 20px;font-size:17px;font-weight:600;color:var(--tint);transition:opacity .1s}
.done.pressed{opacity:.4;transition:none}
.group{margin-top:18px;border-radius:10px;background:var(--cell);overflow:hidden}
.row{position:relative;display:flex;align-items:center;justify-content:space-between;gap:16px;min-height:44px;padding:0 16px;font-size:17px;letter-spacing:-.01em}
.row+.row::before{content:"";position:absolute;top:0;left:16px;right:0;height:.5px;background:var(--sep)}
.val{color:var(--label2);font-variant-numeric:tabular-nums;text-align:right}
.note{padding:7px 16px 0;font-size:13px;line-height:1.38;color:var(--label2)}
@media (prefers-reduced-motion:reduce){.code,.code.pressed,.more,.more.pressed{transition:none;transform:none}}
@media (prefers-contrast:more){.l{color:#fff}.pass{box-shadow:inset 0 0 0 1.5px var(--label)}}
@media (max-height:620px){.primary{margin-top:16px}.primary .v{font-size:26px}.code{width:56%}}
</style>

<script>
(()=>{
const $=id=>document.getElementById(id);
const root=$('root'),code=$('code'),small=$('small'),scan=$('scan'),wash=$('wash'),big=$('big'),meta=$('meta'),more=$('more'),sheet=$('sheet'),scrim=$('scrim'),panel=$('panel'),done=$('done'),offline=$('offline');
const reduced=matchMedia('(prefers-reduced-motion: reduce)');
const coarse=matchMedia('(pointer: coarse)');
const clamp=(v,a,b)=>Math.min(b,Math.max(a,v));
let W=innerWidth,H=innerHeight,T=0;

const orient=()=>{
let a=typeof window.orientation==='number'?window.orientation:(screen.orientation&&screen.orientation.angle)||0;
if(a>180)a-=360;
const handset=coarse.matches&&Math.min(screen.width,screen.height)<600;
T=handset&&Math.abs(a)===90&&innerWidth>innerHeight?-a:0;
W=T?innerHeight:innerWidth;H=T?innerWidth:innerHeight;
root.style.width=W+'px';root.style.height=H+'px';root.style.setProperty('--h',H+'px');
root.style.transform=`translate(-50%,-50%) rotate(${T}deg)`;
root.classList.toggle('turned',T!==0);
};
const toLocal=(x,y)=>{
const r=-T*Math.PI/180,c=Math.cos(r),s=Math.sin(r),dx=x-innerWidth/2,dy=y-innerHeight/2;
return{x:dx*c-dy*s+W/2,y:dx*s+dy*c+H/2};
};
const rectLocal=el=>{
const b=el.getBoundingClientRect(),p=toLocal(b.left,b.top),q=toLocal(b.right,b.bottom);
return{x:Math.min(p.x,q.x),y:Math.min(p.y,q.y),w:Math.abs(q.x-p.x)};
};

class Spring{
constructor(x,tol,draw){this.x=this.t=x;this.v=0;this.tol=tol;this.draw=draw;this.held=false;this.done=null;this.tune(1,.38)}
tune(z,r){const w=2*Math.PI/r;this.k=w*w;this.c=2*z*w;return this}
to(t,v){this.t=t;if(v!==undefined)this.v=v;go(this);return this}
snap(x){this.x=this.t=x;this.v=0}
step(h){const a=-this.k*(this.x-this.t)-this.c*this.v;this.v+=a*h;this.x+=this.v*h}
get rest(){return Math.abs(this.x-this.t)<this.tol&&Math.abs(this.v)<this.tol*10}
}
const live=new Set();let raf=0,last=0;
const frame=now=>{
const dt=clamp((now-last)/1000,.001,.064);last=now;
const n=Math.max(1,Math.ceil(dt*240)),h=dt/n;
const draws=new Set();
for(const s of live){if(!s.held)for(let i=0;i<n;i++)s.step(h);draws.add(s.draw)}
draws.forEach(d=>d());
for(const s of [...live])if(!s.held&&s.rest){s.snap(s.t);live.delete(s);s.draw();if(s.done)s.done()}
raf=live.size?requestAnimationFrame(frame):0;
};
const go=s=>{live.add(s);if(!raf){last=performance.now();raf=requestAnimationFrame(frame)}};
const project=(v,d=.998)=>v/1000*d/(1-d);
const rubber=(o,dim,c=.55)=>o*dim*c/(dim+c*Math.abs(o));
const history=()=>{const pts=[];return{add(y,t){pts.push({y,t});if(pts.length>6)pts.shift()},speed(){const a=pts[0],b=pts[pts.length-1];return a&&b&&b.t>a.t?(b.y-a.y)/(b.t-a.t)*1000:0}}};
const press=el=>{
el.addEventListener('pointerdown',()=>el.classList.add('pressed'));
['pointerup','pointercancel','pointerleave'].forEach(t=>el.addEventListener(t,()=>el.classList.remove('pressed')));
};

let scanOpen=false,from={x:0,y:0,s:1},lock=null,sd=null;
const drawScan=()=>{
const p=P.x,y=Y.x,pull=clamp(y/(H*.5),0,1);
if(reduced.matches){
big.style.transform=`translate3d(0,${y}px,0)`;
big.style.opacity=clamp(p,0,1);
}else{
const s=from.s+(1-from.s)*p,k=1-.18*pull,cx=big.offsetWidth*s*(1-k)/2;
big.style.transform=`translate3d(${from.x*(1-p)+cx}px,${from.y*(1-p)+y}px,0) scale(${s*k})`;
big.style.opacity=1;
}
wash.style.opacity=clamp(p,0,1)*(1-.55*pull);
meta.style.opacity=clamp(p*p*(1-pull*1.6),0,1);
};
const P=new Spring(0,.0005,drawScan),Y=new Spring(0,.3,drawScan);
P.done=()=>{
if(scanOpen||P.t!==0)return;
scan.classList.remove('on');scan.setAttribute('aria-hidden','true');root.classList.remove('scanning');
big.style.transform='';code.focus({preventScroll:true});
};
const measure=()=>{big.style.transform='none';const a=rectLocal(small),b=rectLocal(big);from={x:a.x-b.x,y:a.y-b.y,s:a.w/b.w}};
const wakeOn=async()=>{try{lock=await navigator.wakeLock.request('screen')}catch(e){lock=null}};
const wakeOff=()=>{if(lock){lock.release().catch(()=>{});lock=null}};
const openScan=()=>{
if(!scanOpen){
scanOpen=true;
if(P.x<.001){measure();P.snap(0);Y.snap(0)}
scan.classList.add('on');scan.setAttribute('aria-hidden','false');root.classList.add('scanning');
wakeOn();
}
P.tune(1,.42).to(1);Y.tune(1,.38).to(0);
};
const closeScan=(vp=0,vy=0)=>{scanOpen=false;wakeOff();P.tune(1,.4).to(0,vp);Y.tune(1,.4).to(0,vy)};
press(code);
code.addEventListener('click',openScan);
scan.addEventListener('pointerdown',e=>{
const l=toLocal(e.clientX,e.clientY);
sd={id:e.pointerId,start:l.y,y0:l.y-Math.max(0,Y.x),moved:false,h:history()};
sd.h.add(l.y,e.timeStamp);
P.held=Y.held=true;P.v=Y.v=0;go(P);
});
scan.addEventListener('pointermove',e=>{
if(!sd||e.pointerId!==sd.id)return;
const l=toLocal(e.clientX,e.clientY);
if(!sd.moved){if(Math.abs(l.y-sd.start)<10)return;sd.moved=true;scan.setPointerCapture(e.pointerId)}
const raw=l.y-sd.y0;
Y.x=Y.t=raw<0?rubber(raw,H):raw;
sd.h.add(l.y,e.timeStamp);drawScan();
});
const scanUp=e=>{
if(!sd||e.pointerId!==sd.id)return;
const d=sd;sd=null;P.held=Y.held=false;
if(!d.moved){closeScan();return}
const vy=d.h.speed(),end=Y.x+project(vy);
if(vy>-50&&(end>H*.22||vy>900))closeScan(-Math.max(0,vy)/(H*.9),vy);
else{P.tune(1,.4).to(1);Y.tune(.8,.36).to(0,vy)}
};
scan.addEventListener('pointerup',scanUp);
scan.addEventListener('pointercancel',scanUp);

let sheetOpen=false,sheetH=1,hd=null;
const drawSheet=()=>{
const y=S.x,f=clamp(1-y/sheetH,0,1);
if(reduced.matches){panel.style.transform='none';panel.style.opacity=f}
else{panel.style.transform=`translate3d(0,${y}px,0)`;panel.style.opacity=1}
scrim.style.opacity=f;
};
const S=new Spring(0,.3,drawSheet);
S.done=()=>{
if(sheetOpen)return;
sheet.classList.remove('on');sheet.setAttribute('aria-hidden','true');more.focus({preventScroll:true});
};
const openSheet=()=>{
if(!sheetOpen){
sheetOpen=true;
sheet.classList.add('on');sheet.setAttribute('aria-hidden','false');
sheetH=panel.offsetHeight;
if(!live.has(S))S.snap(sheetH);
drawSheet();
done.focus({preventScroll:true});
}
S.tune(1,.35).to(0);
};
const closeSheet=(v=0)=>{sheetOpen=false;S.tune(1,.32).to(sheetH,v)};
press(more);press(done);
more.addEventListener('click',openSheet);
done.addEventListener('click',()=>closeSheet());
scrim.addEventListener('click',()=>closeSheet());
panel.addEventListener('pointerdown',e=>{
if(e.target.closest('button'))return;
const l=toLocal(e.clientX,e.clientY);
hd={id:e.pointerId,start:l.y,y0:l.y-S.x,moved:false,h:history()};
hd.h.add(l.y,e.timeStamp);
S.held=true;S.v=0;go(S);
});
panel.addEventListener('pointermove',e=>{
if(!hd||e.pointerId!==hd.id)return;
const l=toLocal(e.clientX,e.clientY);
if(!hd.moved){if(Math.abs(l.y-hd.start)<10)return;hd.moved=true;panel.setPointerCapture(e.pointerId)}
const raw=l.y-hd.y0;
S.x=S.t=raw<0?rubber(raw,sheetH):raw;
hd.h.add(l.y,e.timeStamp);drawSheet();
});
const sheetUp=e=>{
if(!hd||e.pointerId!==hd.id)return;
const d=hd;hd=null;S.held=false;
if(!d.moved){S.to(0);return}
const v=d.h.speed(),end=S.x+project(v);
if(v>-50&&end>sheetH*.5)closeSheet(v);
else S.tune(.8,.3).to(0,v);
};
panel.addEventListener('pointerup',sheetUp);
panel.addEventListener('pointercancel',sheetUp);

document.addEventListener('keydown',e=>{if(e.key!=='Escape')return;if(sheetOpen)closeSheet();else if(scanOpen)closeScan()});
document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='visible'&&scanOpen)wakeOn()});

['gesturestart','gesturechange','gestureend','dblclick'].forEach(t=>document.addEventListener(t,e=>e.preventDefault(),{passive:false}));
document.addEventListener('touchstart',e=>{if(e.touches.length>1)e.preventDefault()},{passive:false});
document.addEventListener('touchmove',e=>{if(e.touches.length>1||e.scale&&e.scale!==1)e.preventDefault()},{passive:false});
let lastTouch=0;
document.addEventListener('touchend',e=>{const t=e.timeStamp;if(t-lastTouch<320&&e.cancelable&&!sd&&!hd){e.preventDefault();const b=e.target.closest&&e.target.closest('button');if(b)b.click()}lastTouch=t},{passive:false});

const relayout=()=>{
orient();
if(scanOpen&&!live.has(P)){measure();drawScan()}
if(sheetOpen){sheetH=panel.offsetHeight;drawSheet()}
};
orient();
addEventListener('resize',relayout);
addEventListener('orientationchange',()=>setTimeout(relayout,60));
if(screen.orientation)screen.orientation.addEventListener('change',()=>setTimeout(relayout,60));

if('serviceWorker' in navigator&&(location.protocol==='https:'||location.hostname==='localhost')){
const had=!!navigator.serviceWorker.controller;let reloaded=false;
offline.textContent=had?'Available':'Saving…';
navigator.serviceWorker.addEventListener('controllerchange',()=>{if(had&&!reloaded){reloaded=true;location.reload()}});
navigator.serviceWorker.register('sw.js').then(()=>navigator.serviceWorker.ready).then(()=>{offline.textContent='Available'}).catch(()=>{offline.textContent='Unavailable'});
}
})();
</script>
