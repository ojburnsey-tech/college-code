<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#f2f2f7" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#000000" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="College ID">
<meta name="format-detection" content="telephone=no">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="manifest" href="manifest.webmanifest">
<title>College ID</title>
<style>
:root{color-scheme:light dark;--bg:#f2f2f7;--ink:#000;--ink2:rgba(60,60,67,.6);--shadow:0 24px 48px -16px rgba(30,30,80,.45),0 2px 8px rgba(0,0,0,.08)}
@media (prefers-color-scheme:dark){:root{--bg:#000;--ink:#fff;--ink2:rgba(235,235,245,.6);--shadow:0 24px 60px -18px rgba(94,92,230,.45),0 2px 8px rgba(0,0,0,.5)}}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;background:var(--bg)}
body{font:17px/1.35 -apple-system,BlinkMacSystemFont,"SF Pro Text",system-ui,sans-serif;color:var(--ink);-webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;overflow:hidden;overscroll-behavior:none;touch-action:manipulation}
.app{height:100%;display:flex;flex-direction:column;max-width:440px;margin:0 auto;padding:calc(env(safe-area-inset-top) + 18px) 20px calc(env(safe-area-inset-bottom) + 20px)}
.eyebrow{font-size:13px;font-weight:600;letter-spacing:.04em;text-transform:uppercase;color:var(--ink2)}
h1{font-size:34px;line-height:1.08;font-weight:700;letter-spacing:-.022em;margin-top:2px}
.stage{flex:1;display:flex;flex-direction:column;justify-content:center;min-height:0}
.pass{position:relative;isolation:isolate;overflow:hidden;border-radius:24px;padding:20px;color:#fff;background:radial-gradient(120% 75% at 0% 0%,#5e5ce6 0%,transparent 58%),radial-gradient(110% 70% at 100% 100%,#30b0c7 0%,transparent 62%),linear-gradient(160deg,#2a2a5a 0%,#12122a 100%);box-shadow:inset 0 1px 0 rgba(255,255,255,.22),inset 0 0 0 .5px rgba(255,255,255,.08),var(--shadow);animation:arrive .7s cubic-bezier(.2,.9,.25,1) both}
@keyframes arrive{from{opacity:0;transform:translateY(16px) scale(.98)}}
.sheen{position:absolute;inset:0;z-index:-1;pointer-events:none;background:radial-gradient(260px circle at var(--x,18%) var(--y,0%),rgba(255,255,255,.2),transparent 62%);transition:opacity .5s}
.head{display:flex;align-items:center;gap:12px}
.avatar{flex:none;width:44px;height:44px;border-radius:50%;display:grid;place-items:center;font-size:16px;font-weight:600;letter-spacing:.02em;background:rgba(255,255,255,.16);box-shadow:inset 0 0 0 .5px rgba(255,255,255,.25)}
.label{display:block;font-size:11px;font-weight:600;letter-spacing:.07em;text-transform:uppercase;color:rgba(255,255,255,.62)}
.value{display:block;font-size:20px;font-weight:600;letter-spacing:-.012em;line-height:1.2}
.num{font-variant-numeric:tabular-nums;letter-spacing:.01em}
.code{display:block;width:100%;aspect-ratio:1;margin:20px 0;padding:16px;border:0;border-radius:18px;background:#fff;cursor:pointer;box-shadow:0 10px 24px -10px rgba(0,0,0,.45),0 0 0 .5px rgba(0,0,0,.06);transition:transform .14s ease-out;-webkit-appearance:none;appearance:none}
.code.pressed{transform:scale(.97);transition-duration:.08s}
.code svg,.big svg{display:block;width:100%;height:100%}
.code svg{transition:opacity .15s}
.scanning .code svg{opacity:0;transition:none}
.foot{display:flex;align-items:flex-end;justify-content:space-between;gap:12px}
.pill{display:none;align-items:center;gap:6px;padding:6px 10px;border-radius:999px;font-size:12px;font-weight:600;letter-spacing:.01em;background:rgba(255,255,255,.14);box-shadow:inset 0 0 0 .5px rgba(255,255,255,.2);-webkit-backdrop-filter:blur(12px);backdrop-filter:blur(12px)}
.pill.show{display:inline-flex}
.dot{width:7px;height:7px;border-radius:50%;background:#ffd60a;transition:background .3s}
.pill.ready .dot{background:#30d158;box-shadow:0 0 8px #30d158}
.hint{margin-top:18px;text-align:center;font-size:13px;color:var(--ink2)}
.scan{position:fixed;inset:0;z-index:10;display:flex;flex-direction:column;align-items:center;justify-content:center;visibility:hidden;pointer-events:none;touch-action:none}
.scan.on{visibility:visible;pointer-events:auto}
.wash{position:absolute;inset:0;background:#fff;opacity:0}
.big{position:relative;width:min(86vw,60vh,520px);aspect-ratio:1;transform-origin:0 0;will-change:transform}
.meta{position:relative;margin-top:28px;color:#000;font-size:17px;font-weight:600;letter-spacing:-.01em;font-variant-numeric:tabular-nums;opacity:0}
.close{position:absolute;bottom:calc(env(safe-area-inset-bottom) + 28px);font-size:13px;color:rgba(60,60,67,.6);opacity:0}
@media (prefers-reduced-motion:reduce){.pass{animation:none}.code,.code.pressed{transition:none;transform:none}}
@media (prefers-reduced-transparency:reduce){.pill{-webkit-backdrop-filter:none;backdrop-filter:none;background:rgba(0,0,0,.45)}}
@media (prefers-contrast:more){.pass{background:#12122a;box-shadow:inset 0 0 0 1.5px #fff}.label{color:#fff}}
@media (max-height:640px){h1{font-size:28px}.code{margin:14px 0}.pass{padding:16px}}
</style>
</head>
<body>
<svg width="0" height="0" style="position:absolute" aria-hidden="true"><defs><path id="qr" d="M0 0h7v1h-7zM9 0h1v1h-1zM12 0h1v1h-1zM14 0h7v1h-7zM0 1h1v1h-1zM6 1h1v1h-1zM8 1h1v1h-1zM11 1h1v1h-1zM14 1h1v1h-1zM20 1h1v1h-1zM0 2h1v1h-1zM2 2h3v1h-3zM6 2h1v1h-1zM9 2h1v1h-1zM14 2h1v1h-1zM16 2h3v1h-3zM20 2h1v1h-1zM0 3h1v1h-1zM2 3h3v1h-3zM6 3h1v1h-1zM8 3h1v1h-1zM11 3h1v1h-1zM14 3h1v1h-1zM16 3h3v1h-3zM20 3h1v1h-1zM0 4h1v1h-1zM2 4h3v1h-3zM6 4h1v1h-1zM10 4h3v1h-3zM14 4h1v1h-1zM16 4h3v1h-3zM20 4h1v1h-1zM0 5h1v1h-1zM6 5h1v1h-1zM8 5h3v1h-3zM12 5h1v1h-1zM14 5h1v1h-1zM20 5h1v1h-1zM0 6h7v1h-7zM8 6h1v1h-1zM10 6h1v1h-1zM12 6h1v1h-1zM14 6h7v1h-7zM10 7h3v1h-3zM0 8h5v1h-5zM6 8h4v1h-4zM12 8h2v1h-2zM15 8h1v1h-1zM17 8h1v1h-1zM19 8h1v1h-1zM0 9h2v1h-2zM4 9h1v1h-1zM7 9h4v1h-4zM12 9h1v1h-1zM15 9h1v1h-1zM18 9h2v1h-2zM0 10h1v1h-1zM2 10h2v1h-2zM5 10h3v1h-3zM11 10h1v1h-1zM13 10h1v1h-1zM16 10h2v1h-2zM19 10h1v1h-1zM0 11h2v1h-2zM3 11h3v1h-3zM7 11h1v1h-1zM10 11h1v1h-1zM15 11h2v1h-2zM19 11h2v1h-2zM0 12h1v1h-1zM2 12h3v1h-3zM6 12h2v1h-2zM11 12h1v1h-1zM13 12h1v1h-1zM16 12h5v1h-5zM8 13h1v1h-1zM10 13h5v1h-5zM17 13h1v1h-1zM19 13h1v1h-1zM0 14h7v1h-7zM8 14h2v1h-2zM12 14h1v1h-1zM14 14h2v1h-2zM17 14h2v1h-2zM0 15h1v1h-1zM6 15h1v1h-1zM9 15h6v1h-6zM17 15h1v1h-1zM20 15h1v1h-1zM0 16h1v1h-1zM2 16h3v1h-3zM6 16h1v1h-1zM8 16h3v1h-3zM12 16h1v1h-1zM15 16h1v1h-1zM17 16h1v1h-1zM0 17h1v1h-1zM2 17h3v1h-3zM6 17h1v1h-1zM8 17h1v1h-1zM12 17h1v1h-1zM15 17h1v1h-1zM18 17h1v1h-1zM0 18h1v1h-1zM2 18h3v1h-3zM6 18h1v1h-1zM8 18h4v1h-4zM13 18h1v1h-1zM16 18h1v1h-1zM18 18h1v1h-1zM0 19h1v1h-1zM6 19h1v1h-1zM8 19h1v1h-1zM10 19h1v1h-1zM15 19h2v1h-2zM18 19h2v1h-2zM0 20h7v1h-7zM8 20h1v1h-1zM11 20h1v1h-1zM13 20h1v1h-1zM16 20h1v1h-1zM18 20h1v1h-1z"/></defs></svg>
<main class="app" id="app">
<header>
<p class="eyebrow">Belfast Met</p>
<h1>Student ID</h1>
</header>
<div class="stage">
<section class="pass" id="pass">
<div class="sheen" id="sheen"></div>
<div class="head">
<div class="avatar">OB</div>
<div><span class="label">Student</span><span class="value">Oliver Burns</span></div>
</div>
<button class="code" id="code" type="button" aria-label="Show code full screen for scanning"><svg id="small" viewBox="-2 -2 25 25" shape-rendering="crispEdges"><use href="#qr"/></svg></button>
<div class="foot">
<div><span class="label">Student No.</span><span class="value num">50123162</span></div>
<span class="pill" id="pill"><span class="dot"></span><span id="pillText">Saving offline</span></span>
</div>
</section>
<p class="hint">Tap the code to make it bigger for the scanner</p>
</div>
</main>
<div class="scan" id="scan" role="dialog" aria-label="Scan code" aria-hidden="true">
<div class="wash" id="wash"></div>
<div class="big" id="big"><svg viewBox="-2 -2 25 25" shape-rendering="crispEdges"><rect x="-2" y="-2" width="25" height="25" fill="#fff"/><use href="#qr"/></svg></div>
<p class="meta" id="meta">Oliver Burns · 50123162</p>
<p class="close" id="closeHint">Tap or swipe down to close</p>
</div>
<script>
(()=>{
const $=id=>document.getElementById(id);
const app=$('app'),pass=$('pass'),sheen=$('sheen'),code=$('code'),small=$('small'),scan=$('scan'),wash=$('wash'),big=$('big'),meta=$('meta'),closeHint=$('closeHint'),pill=$('pill'),pillText=$('pillText');
const reduced=matchMedia('(prefers-reduced-motion: reduce)');

class Spring{
constructor(x,tol){this.x=x;this.v=0;this.t=x;this.tol=tol;this.tune(1,.38)}
tune(z,r){const w=2*Math.PI/r;this.k=w*w;this.c=2*z*w;return this}
to(t,v){this.t=t;if(v!==undefined)this.v=v;return this}
snap(x){this.x=this.t=x;this.v=0}
step(dt){const a=-this.k*(this.x-this.t)-this.c*this.v;this.v+=a*dt;this.x+=this.v*dt}
get rest(){return Math.abs(this.x-this.t)<this.tol&&Math.abs(this.v)<this.tol*10}
}

const P=new Spring(0,.0005),Y=new Spring(0,.3);
let from=null,to=null,running=false,last=0,open=false,drag=null,lock=null;

const measure=()=>{
big.style.transform='none';
const a=small.getBoundingClientRect(),b=big.getBoundingClientRect();
from={x:a.left-b.left,y:a.top-b.top,s:a.width/b.width};
to={x:0,y:0,s:1};
};

const render=()=>{
const p=P.x,y=Y.x,h=innerHeight;
const pull=Math.min(1,Math.max(0,y)/(h*.5));
if(reduced.matches){
big.style.transform=`translate3d(0,${y}px,0)`;
big.style.opacity=Math.max(0,p);
}else{
const s=from.s+(1-from.s)*p,k=1-.18*pull;
const cx=big.offsetWidth*s*(1-k)/2;
big.style.transform=`translate3d(${from.x*(1-p)+cx}px,${from.y*(1-p)+y}px,0) scale(${s*k})`;
big.style.opacity=1;
}
const fade=Math.max(0,Math.min(1,p))*(1-.55*pull);
wash.style.opacity=fade;
meta.style.opacity=Math.max(0,p*p*(1-pull*1.6));
closeHint.style.opacity=Math.max(0,p*p*(1-pull*2));
};

const tick=now=>{
const dt=Math.min(.064,Math.max(.001,(now-last)/1000));last=now;
if(!drag){let n=Math.max(1,Math.ceil(dt*240));const h=dt/n;while(n-->0){P.step(h);Y.step(h)}}
render();
if(!drag&&P.rest&&Y.rest){
P.snap(P.t);Y.snap(Y.t);render();running=false;
if(P.t===0)finishClose();
return;
}
requestAnimationFrame(tick);
};
const run=()=>{if(!running){running=true;last=performance.now();requestAnimationFrame(tick)}};

const wake=async()=>{try{lock=await navigator.wakeLock?.request('screen')}catch(e){}};
const sleep=()=>{try{lock?.release()}catch(e){}lock=null};

const show=()=>{
if(!open){
open=true;
if(P.x<=.0005){measure();P.snap(0);Y.snap(0)}
scan.classList.add('on');scan.setAttribute('aria-hidden','false');app.classList.add('scanning');
wake();
}
P.tune(1,.42).to(1);Y.tune(1,.38).to(0);run();
};
const hide=(vp,vy)=>{
open=false;
P.tune(1,.4).to(0,vp);Y.tune(1,.4).to(0,vy);run();
sleep();
};
const finishClose=()=>{
if(open)return;
scan.classList.remove('on');scan.setAttribute('aria-hidden','true');app.classList.remove('scanning');
big.style.transform='';
};

const project=(v,d=.998)=>v/1000*d/(1-d);
const rubber=(o,dim,c=.55)=>o*dim*c/(dim+c*Math.abs(o));

code.addEventListener('pointerdown',()=>code.classList.add('pressed'));
['pointerup','pointercancel','pointerleave'].forEach(t=>code.addEventListener(t,()=>code.classList.remove('pressed')));
code.addEventListener('click',show);

scan.addEventListener('pointerdown',e=>{
scan.setPointerCapture(e.pointerId);
drag={id:e.pointerId,y0:e.clientY-Math.max(0,Y.x),moved:false,hist:[{y:e.clientY,t:e.timeStamp}],start:e.clientY};
P.to(P.x,0);P.v=0;Y.v=0;
});
scan.addEventListener('pointermove',e=>{
if(!drag||e.pointerId!==drag.id)return;
const raw=e.clientY-drag.y0;
if(!drag.moved&&Math.abs(e.clientY-drag.start)<10)return;
drag.moved=true;
Y.x=Y.t=raw<0?rubber(raw,innerHeight):raw;
drag.hist.push({y:e.clientY,t:e.timeStamp});
if(drag.hist.length>6)drag.hist.shift();
render();
});
const release=e=>{
if(!drag||e.pointerId!==drag.id)return;
const d=drag;drag=null;
if(!d.moved){hide(0,0);return}
const h=d.hist,a=h[0],b=h[h.length-1];
const vy=b.t>a.t?(b.y-a.y)/(b.t-a.t)*1000:0;
const end=Y.x+project(vy);
if(vy>=-50&&(end>innerHeight*.22||vy>900)){
hide(-Math.max(0,vy)/(innerHeight*.9),vy);
}else{
P.tune(1,.4).to(1);Y.tune(.8,.36).to(0,vy);run();
}
};
scan.addEventListener('pointerup',release);
scan.addEventListener('pointercancel',release);

document.addEventListener('keydown',e=>{if(e.key==='Escape'&&open)hide(0,0)});
document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='visible'&&open)wake()});
addEventListener('resize',()=>{if(!running&&open){measure();render()}});

const moveSheen=e=>{
const r=pass.getBoundingClientRect();
sheen.style.setProperty('--x',`${e.clientX-r.left}px`);
sheen.style.setProperty('--y',`${e.clientY-r.top}px`);
};
pass.addEventListener('pointermove',moveSheen);
pass.addEventListener('pointerdown',moveSheen);
pass.addEventListener('pointerleave',()=>{sheen.style.removeProperty('--x');sheen.style.removeProperty('--y')});

const status=ready=>{pill.classList.add('show');pill.classList.toggle('ready',ready);pillText.textContent=ready?'Works offline':'Saving offline'};
if('serviceWorker' in navigator&&(location.protocol==='https:'||location.hostname==='localhost')){
status(!!navigator.serviceWorker.controller);
navigator.serviceWorker.register('sw.js').then(()=>navigator.serviceWorker.ready).then(()=>status(true)).catch(()=>pill.classList.remove('show'));
}
})();
</script>
</body>
</html>
